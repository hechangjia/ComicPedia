# =============================================================
# ComicPedia Showcase Mode
# 纯展示模式：本地打包镜像 → 传输到服务器 → 导入数据即可使用
#
# 快速开始：
#   docker compose -f docker-compose.showcase.yml up -d
#   curl -X POST http://localhost:6623/api/backup/import \
#     -H "Content-Type: application/json" -d @backup.json
# =============================================================

services:
  comicpedia:
    image: comicpedia:showcase
    ports:
      - "6623:61323"
    environment:
      - NODE_ENV=production
      - SHOWCASE_MODE=true
      # 导入鉴权 token（防止任何人上传数据，只有知道 token 的人才能导入）
      # 修改为你自己的随机字符串
      - ADMIN_TOKEN=${ADMIN_TOKEN:-comicpedia-admin-change-me}
    volumes:
      - comicpedia-showcase:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:61323/api/health',(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  comicpedia-showcase:
    driver: local
