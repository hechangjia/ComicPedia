services:
  comicpedia:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-61323}:61323"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - comicpedia-data:/app/data
      - comicpedia-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get('http://localhost:61323/api/health',(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理（HTTPS + 静态资源缓存）
